name: CI/CD Security & Code Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Python Tests (Multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: CI Bağımlılıklarını Yükle
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    - name: Kod Standartları Kontrolü (Flake8 Linter)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Güvenlik Taraması (Bandit Security Scan)
      run: |
        bandit -r src/ -x src/test_detector.py

    - name: Detector Unit Testlerini Çalıştır
      run: |
        python -m unittest src/test_detector.py

  sim-run:
    name: Run Red-Blue Exploit Simulation
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Simülasyonu Çalıştır (Boru Hattı Testi)
      run: |
        python src/exploit_sim.py | python src/detector.py

    - name: Test Rapor Çıktısını Kontrol Et
      run: |
        cat reports/detection_results.json

    - name: Raporu Artifact Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: detection_results
        path: reports/detection_results.json
